name: C++ Build & Quality Check

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        runs: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essentials clang-tidy cppcheck

      - name: Linter / Code Quality Check
        run: cppcheck --enable=all --error-exitcode=1 src/

      - name: CMake configure
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile
        run: cmake --build build --config Release

      - name: run tests
        run: cmake --test-dir build --output-on-failure