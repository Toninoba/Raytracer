name: C++ Build & Quality Check

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-tidy cppcheck

      - name: Linter / Code Quality Check (cppcheck)
        run: cppcheck --enable=warning,performance,portability --suppress=missingIncludeSystem src/

      - name: CMake konfigurieren
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Kompilieren (Build)
        run: cmake --build build --config Release

      - name: Tests ausführen
        run: ctest --test-dir build --output-on-failure